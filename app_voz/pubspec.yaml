name: app_voz
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.3.0
  sqflite: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.7
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  record: ^6.2.0
  flutter_sound: ^9.28.0
  just_audio: ^0.10.5
  flutter_tts: ^4.2.5
  flutter_foreground_task: ^9.2.2
  google_sign_in: ^7.2.0
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/voice_first_app.png
    - assets/branding/touchless_icon.png
    - assets/branding/touchless_launcher.png